services:
  - type: web
    name: billbot-backend
    env: docker
    dockerfilePath: ./billbot-backend/Dockerfile
    dockerContext: ./billbot-backend
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: JPA_DDL_AUTO
        value: update
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: FLYWAY_ENABLED
        value: false
      - key: DB_REQUIRED
        value: true
